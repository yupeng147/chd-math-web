<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>可视化图谱</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
<style>
  body { margin: 0; padding: 0; background: #0b0e14; color: #e6edf3; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; overflow: hidden; }
  #chart { width: 100vw; height: 100vh; }
  .title-bar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); font-size: 20px; font-weight: 900; color: #00f0ff; z-index: 10; text-shadow: 0 0 12px rgba(0,240,255,0.4); pointer-events: none; letter-spacing: 2px; }
  .legend { position: absolute; bottom: 15px; left: 15px; background: rgba(20,24,32,.85); padding: 10px 14px; border-radius: 8px; font-size: 12px; border: 1px solid #2a2f3a; z-index: 10; max-width: 220px; }
  .legend .item { display: flex; align-items: center; margin: 4px 0; color: #a0aec0; font-weight: 700; }
  .legend .dot { width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
  .legend .center-dot { width: 12px; height: 12px; border-radius: 50%; background: #00f0ff; margin-right: 8px; box-shadow: 0 0 8px #00f0ff; }
  .tip { position: absolute; bottom: 15px; right: 15px; font-size: 12px; color: #8ab4f8; background: rgba(20,24,32,.85); padding: 8px 12px; border-radius: 8px; border: 1px solid #2a2f3a; z-index: 10; font-weight: 600; }
  .btn-reset { position: absolute; top: 50px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(0,240,255,.15); border: 1px solid #00f0ff; color: #00f0ff; padding: 5px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; display: none; }
  .btn-reset.show { display: block; }
  .btn-reset:hover { background: rgba(0,240,255,.3); }
</style>
</head>
<body>
<div class="title-bar">可视化图谱</div>
<button class="btn-reset" id="btnReset" onclick="resetView()">返回全览</button>
<div id="chart"></div>
<div class="legend" id="legend"></div>
<div class="tip">🖱 单击模块聚焦放大<br>🖱 滚轮缩放 · 拖拽平移</div>

<script>
var chart = echarts.init(document.getElementById('chart'));
var focused = null;

// 完整 10 章模块与 56 个画板数据
var modules = [
  { id: "M1", short: "模块一 实数集与函数", color: "#3b82f6", ang: 0 },
  { id: "M2", short: "模块二 极限的语言", color: "#10b981", ang: 36 },
  { id: "M3", short: "模块三 两个重要极限与无穷小", color: "#f59e0b", ang: 72 },
  { id: "M4", short: "模块四 函数的连续性", color: "#ef4444", ang: 108 },
  { id: "M5", short: "模块五 导数和微分", color: "#8b5cf6", ang: 144 },
  { id: "M6", short: "模块六 微分中值定理及其应用", color: "#ec4899", ang: 180 },
  { id: "M7", short: "模块七 实数的完备性", color: "#06b6d4", ang: 216 },
  { id: "M8", short: "模块八 不定积分与定积分", color: "#f97316", ang: 252 },
  { id: "M9", short: "模块九 定积分的应用", color: "#84cc16", ang: 288 },
  { id: "M10", short: "模块十 反常积分", color: "#6366f1", ang: 324 }
];

var gps = [
  { gp: "GP-01", full: "数轴上的区间与邻域(含空心邻域)", mod: "M1", lvl: "A" },
  { gp: "GP-02", full: "确界原理：上确界与下确界的动态搜索", mod: "M1", lvl: "A" },
  { gp: "GP-03", full: "函数图像的变换(平移、反号、绝对值、sgn、取整)", mod: "M1", lvl: "B" },
  { gp: "GP-04", full: "复合函数与反函数(关于y=x的对称)", mod: "M1", lvl: "B" },
  { gp: "GP-05", full: "数列极限的ε-N定义动态演示", mod: "M2", lvl: "A" },
  { gp: "GP-06", full: "迫敛性(夹逼定理)", mod: "M2", lvl: "A" },
  { gp: "GP-07", full: "单调有界定理与数e的生成", mod: "M2", lvl: "A" },
  { gp: "GP-08", full: "递推数列的迭代与蛛网图", mod: "M2", lvl: "B" },
  { gp: "GP-09", full: "柯西收敛准则", mod: "M2", lvl: "B" },
  { gp: "GP-10", full: "函数极限的ε-δ定义动态演示", mod: "M2", lvl: "A" },
  { gp: "GP-11", full: "单侧极限与极限不存在(典型反例)", mod: "M2", lvl: "A" },
  { gp: "GP-12", full: "第一个重要极限sin x/x→1(扇形夹逼)", mod: "M3", lvl: "A" },
  { gp: "GP-13", full: "第二个重要极限(1+1/x)^x→e", mod: "M3", lvl: "A" },
  { gp: "GP-14", full: "无穷小量与阶的比较(o、O、~)", mod: "M3", lvl: "B" },
  { gp: "GP-15", full: "曲线的渐近线(水平、垂直、斜渐近线)", mod: "M3", lvl: "B" },
  { gp: "GP-16", full: "函数在一点连续与连续性", mod: "M4", lvl: "B" },
  { gp: "GP-17", full: "间断点及其分类", mod: "M4", lvl: "A" },
  { gp: "GP-18", full: "闭区间上连续函数的性质(最值、介值、零点)", mod: "M4", lvl: "A" },
  { gp: "GP-19", full: "一致连续与非一致连续", mod: "M4", lvl: "B" },
  { gp: "GP-20", full: "导数的几何意义：割线趋近切线", mod: "M5", lvl: "A" },
  { gp: "GP-21", full: "瞬时速度与变化率", mod: "M5", lvl: "B" },
  { gp: "GP-22", full: "左、右导数与不可导点", mod: "M5", lvl: "A" },
  { gp: "GP-23", full: "参变量函数与极坐标曲线的切线方向", mod: "M5", lvl: "C" },
  { gp: "GP-24", full: "高阶导数与莱布尼茨公式", mod: "M5", lvl: "B" },
  { gp: "GP-25", full: "微分的几何意义与近似计算", mod: "M5", lvl: "B" },
  { gp: "GP-26", full: "罗尔定理与拉格朗日中值定理", mod: "M6", lvl: "A" },
  { gp: "GP-27", full: "柯西中值定理", mod: "M6", lvl: "B" },
  { gp: "GP-28", full: "洛必达法则与各类不定式极限", mod: "M6", lvl: "A" },
  { gp: "GP-29", full: "泰勒公式与泰勒多项式逼近(阶数可调)", mod: "M6", lvl: "A" },
  { gp: "GP-30", full: "极值判别(第一、第二、第三充分条件)", mod: "M6", lvl: "B" },
  { gp: "GP-31", full: "最大值、最小值应用(最优化建模)", mod: "M6", lvl: "B" },
  { gp: "GP-32", full: "凸性、拐点与延森不等式", mod: "M6", lvl: "A" },
  { gp: "GP-33", full: "函数图像讨论(完整作图流程)", mod: "M6", lvl: "A" },
  { gp: "GP-34", full: "牛顿切线法(方程近似解的迭代)", mod: "M6", lvl: "A" },
  { gp: "GP-35", full: "区间套定理", mod: "M7", lvl: "C" },
  { gp: "GP-36", full: "聚点与致密性定理", mod: "M7", lvl: "B" },
  { gp: "GP-37", full: "有限覆盖定理(开覆盖的可视化)", mod: "M7", lvl: "C" },
  { gp: "GP-38", full: "上极限与下极限", mod: "M7", lvl: "B" },
  { gp: "GP-39", full: "原函数与积分曲线族", mod: "M8", lvl: "A" },
  { gp: "GP-40", full: "换元积分法(第一类与第二类)", mod: "M8", lvl: "B" },
  { gp: "GP-41", full: "分部积分法与递推公式(Wallis公式)", mod: "M8", lvl: "C" },
  { gp: "GP-42", full: "黎曼和与曲边梯形面积(分割加细)", mod: "M8", lvl: "A" },
  { gp: "GP-43", full: "达布上和、下和与可积准则", mod: "M8", lvl: "B" },
  { gp: "GP-44", full: "牛顿-莱布尼茨公式与变上限积分", mod: "M8", lvl: "A" },
  { gp: "GP-45", full: "积分中值定理与函数平均值", mod: "M8", lvl: "B" },
  { gp: "GP-46", full: "定积分的换元法与分部积分法", mod: "M8", lvl: "C" },
  { gp: "GP-47", full: "平面图形的面积(直角坐标、参数式、极坐标)", mod: "M9", lvl: "A" },
  { gp: "GP-48", full: "由平行截面面积求体积(含旋转体)", mod: "M9", lvl: "A" },
  { gp: "GP-49", full: "平面曲线的弧长", mod: "M9", lvl: "B" },
  { gp: "GP-50", full: "曲率、曲率圆与铁路弯道缓冲", mod: "M9", lvl: "B" },
  { gp: "GP-51", full: "旋转曲面的面积(圆台微元与圆柱微元的对比)", mod: "M9", lvl: "B" },
  { gp: "GP-52", full: "定积分在物理中的应用(静压力、引力、功)", mod: "M9", lvl: "C" },
  { gp: "GP-53", full: "无穷积分的面积直观与收敛性", mod: "M10", lvl: "A" },
  { gp: "GP-54", full: "瑕积分的面积直观", mod: "M10", lvl: "B" },
  { gp: "GP-55", full: "比较判别法与p-积分基准", mod: "M10", lvl: "B" },
  { gp: "GP-56", full: "狄利克雷、阿贝尔判别法与条件收敛", mod: "M10", lvl: "C" }
];

var nodes = [], links = [];
var R_MOD = 150, R_GP_BASE = 240;

// 中心节点
nodes.push({ id: "center", name: "数学分析(上册)", fullName: "数学分析（第六版·上册）", isCenter: true, symbolSize: 60, itemStyle: { color: "#00f0ff" }, label: { show: true, fontSize: 15, fontWeight: "bold", color: "#fff", fontStyle: "normal" }, x: 0, y: 0, fixed: true });

// 模块与画板
modules.forEach(function(m) {
  var rad = m.ang * Math.PI / 180;
  nodes.push({ id: m.id, name: m.short, fullName: m.short, isModule: true, modColor: m.color, symbolSize: 42, itemStyle: { color: m.color }, label: { show: true, fontSize: 13, fontWeight: "bold", color: "#fff" }, x: R_MOD * Math.cos(rad), y: R_MOD * Math.sin(rad), fixed: true });
  links.push({ source: "center", target: m.id });

  var mg = gps.filter(function(g) { return g.mod === m.id; });
  var span = mg.length >= 9 ? 0.48 : mg.length >= 7 ? 0.40 : 0.34;
  var startAng = rad - span / 2;
  mg.forEach(function(g, i) {
    var idx = mg.length === 1 ? 0.5 : (i / (mg.length - 1));
    var a = startAng + idx * span;
    var r = R_GP_BASE + (m.ang >= 90 && m.ang <= 270 ? 25 : 0);
    nodes.push({ id: g.gp, name: g.gp, fullName: g.full, gp: g.gp, mod: m.id, lvl: g.lvl, isGP: true, modColor: m.color, symbolSize: 14, itemStyle: { color: m.color, opacity: 0 }, label: { show: false, fontSize: 11, fontWeight: "bold", color: "#e6edf3" }, link: "pages/demo.html?id=" + g.gp, x: r * Math.cos(a), y: r * Math.sin(a), fixed: false });
    links.push({ source: m.id, target: g.gp });
  });
});

function buildSeries() {
  var data = nodes.map(function(nd) {
    var n = Object.assign({}, nd);
    if (n.isGP) {
      var show = focused === n.mod;
      n.label.show = show;
      n.label.formatter = show ? "{b}  " + n.fullName.substring(0, 14) + (n.fullName.length > 14 ? "..." : "") : "{b}";
      n.itemStyle.opacity = show ? 1 : 0;
      n.symbolSize = show ? 18 : 6;
      if (show) n.fixed = true; else n.fixed = false;
    }
    if (n.isModule) {
      var active = !focused || focused === n.id;
      n.itemStyle.opacity = active ? 1 : 0.3;
      n.label.opacity = active ? 1 : 0.35;
    }
    return n;
  });
  var lks = links.map(function(l) {
    var ld = Object.assign({}, l);
    var show = false;
    if (l.source === "center") show = !focused || focused === l.target;
    else show = focused === l.source;
    ld.lineStyle = { opacity: show ? (l.source === "center" ? 0.4 : 0.8) : 0.03, curveness: 0.02 };
    return ld;
  });
  return { type: "graph", layout: "none", data: data, links: lks, roam: true, draggable: true, zoom: 1, center: [0, 0], emphasis: { focus: "adjacency", scale: 1.2, itemStyle: { shadowBlur: 15, shadowColor: "#00f0ff" } } };
}

chart.setOption({
  backgroundColor: "#0b0e14",
  tooltip: { trigger: "item", backgroundColor: "rgba(20,24,32,.97)", borderColor: "#3b82f6", textStyle: { color: "#e6edf3", fontSize: 12.5 },
    formatter: function(p) {
      var d = p.data;
      if (d.isCenter) return '<b style="color:#00f0ff">' + d.fullName + '</b><br>共 10 个模块 · 56 个交互式画板<br><span style="color:#8ab4f8">🖱 单击模块聚焦放大</span>';
      if (d.isModule) return '<b style="color:' + d.modColor + '">' + d.fullName + '</b><br>含 ' + gps.filter(function(g){return g.mod===d.id;}).length + ' 个画板<br><span style="color:#fbbf24">🖱 单击聚焦放大</span>';
      if (d.isGP) return '<b style="color:' + d.modColor + '">' + d.gp + '</b>　' + d.fullName + '<br><span style="color:#8ab4f8">优先级：' + d.lvl + '</span><br><span style="color:#34d399">➤ 点击跳转交互式画板</span>';
      return d.name;
    }
  },
  series: [buildSeries()]
});

// 点击模块：局部放大（平滑缩放平移到该模块区域）
chart.on("click", function(params) {
  var d = params.data;
  if (d.link) { window.location.href = d.link; return; }
  if (d.isModule) {
    if (focused === d.id) {
      resetView();
    } else {
      focused = d.id;
      // 局部放大：将视口中心移到该模块位置，放大 2.2 倍
      var targetX = d.x * 2.2, targetY = d.y * 2.2;
      chart.setOption({
        series: [Object.assign({}, buildSeries(), {
          center: [targetX, targetY],
          zoom: 2.2
        })]
      }, true);
      document.getElementById('btnReset').classList.add('show');
    }
  }
});

// 双击空白：返回全览
chart.getZr().on("dblclick", function(e) { if (!e.target) resetView(); });

function resetView() {
  focused = null;
  chart.setOption({
    series: [Object.assign({}, buildSeries(), { center: [0, 0], zoom: 1 })]
  }, true);
  document.getElementById('btnReset').classList.remove('show');
}

// 图例
(function() {
  var html = '<div class="item"><span class="center-dot"></span>中心节点（上册全貌）</div>';
  modules.forEach(function(m) { html += '<div class="item"><span class="dot" style="background:' + m.color + '"></span>' + m.short + '</div>'; });
  document.getElementById("legend").innerHTML = html;
})();

window.addEventListener("resize", function(){ chart.resize(); });
</script>
</body>
</html>
