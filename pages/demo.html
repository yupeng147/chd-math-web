<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>动态可视化交互模型</title>
  <script src="https://www.geogebra.org/apps/script/api.js"></script>
  <style>
    body { margin: 0; font-family: sans-serif; text-align: center; }
    #applet { width: 800px; height: 500px; margin: 20px auto; border: 1px solid #ccc; }
  </style>
</head>
<body>
  <h2>知识点演示：<span id="title"></span></h2>
  <p>（动态可视化交互模型组提供 .ggb 后，此处将显示 GeoGebra 动态可视化交互模型）</p>
  <div id="applet"></div>
  <script>
    var id = new URLSearchParams(location.search).get('id') || 'default';
    document.getElementById('title').innerText = id;
    // 后续动态可视化交互模型组给 material_id 后填在这里
    var ggbApp = new GGBApplet({
      "material_id": "j4k3l2m1", 
      "width": 800, "height": 500,
      "showToolBar": true
    }, true);
    ggbApp.inject('applet');
  </script>
</body>
</html>
